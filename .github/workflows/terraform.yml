name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destroy:
        description: Destroy the Terraform-managed infrastructure
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_quicksight_user: ${{ vars.QUICKSIGHT_USER }}
  TF_STATE_KEY: breakglass-observability/terraform.tfstate

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lambda function and dependency layer
        run: |
          rm -rf modules/ingestion/build
          mkdir -p modules/ingestion/build/function modules/ingestion/build/layer/python
          cp lambda/converter/handler.py modules/ingestion/build/function/handler.py
          docker run --rm --platform linux/amd64 \
            -v "$PWD/lambda/converter:/source:ro" \
            -v "$PWD/modules/ingestion/build:/build" \
            python:3.12.13-slim-bookworm \
            /bin/sh -c 'pip install --no-cache-dir -r /source/requirements.txt -t /build/layer/python'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.TF_STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || !inputs.destroy
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.destroy)
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.destroy
        run: terraform destroy -input=false -auto-approve
