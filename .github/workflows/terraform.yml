name: Terraform

on:
  pull_request:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "permission-policy.json"
  workflow_dispatch:
    inputs:
      destroy:
        description: Destroy the Terraform-managed infrastructure
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_quicksight_user: ${{ vars.QUICKSIGHT_USER }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET || format('breakglass-observability-{0}', secrets.AWS_ACCOUNT_ID) }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'breakglass-observability/terraform.tfstate' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Check backend configuration
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "TF_STATE_BUCKET is empty. Set the TF_STATE_BUCKET repository variable or secret, or set AWS_ACCOUNT_ID as a secret." >&2
            exit 1
          fi

      - name: Terraform init
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.TF_STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || !inputs.destroy
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.destroy)
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.destroy
        run: terraform destroy -input=false -auto-approve
