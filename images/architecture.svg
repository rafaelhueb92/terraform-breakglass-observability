<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="980" fill="#f7f9fc"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#202124">Break-Glass Observability — Architecture</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#5f6368">CloudTrail → Parquet lake → Athena → QuickSight</text>

  <!-- ============ LAYER 1: IDENTITY ============ -->
  <rect x="30" y="80" width="1040" height="120" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="50" y="102" font-size="13" font-weight="bold" fill="#1a73e8">1 · Identity &amp; Detection</text>

  <rect x="60" y="115" width="200" height="60" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="160" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">Trusted Principals</text>
  <text x="160" y="158" text-anchor="middle" font-size="11" fill="#5f6368">IAM users / roles</text>

  <rect x="330" y="115" width="220" height="60" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="440" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">BreakGlassRole</text>
  <text x="440" y="158" text-anchor="middle" font-size="11" fill="#5f6368">sts:AssumeRole · S3/RDS/EKS/SQS</text>

  <rect x="620" y="115" width="220" height="60" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="730" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">CloudTrail Trail</text>
  <text x="730" y="158" text-anchor="middle" font-size="11" fill="#5f6368">management + S3 data events</text>

  <rect x="900" y="115" width="150" height="60" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="975" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">Raw Logs S3</text>
  <text x="975" y="158" text-anchor="middle" font-size="11" fill="#5f6368">breakglass-…-cloudtrail</text>

  <line x1="260" y1="145" x2="328" y2="145" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="550" y1="145" x2="618" y2="145" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="840" y1="145" x2="898" y2="145" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ============ LAYER 2: INGESTION ============ -->
  <rect x="30" y="220" width="1040" height="200" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="50" y="242" font-size="13" font-weight="bold" fill="#b06000">2 · Ingestion &amp; Transformation</text>

  <rect x="60" y="260" width="200" height="60" rx="8" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="160" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">EventBridge Rule</text>
  <text x="160" y="303" text-anchor="middle" font-size="11" fill="#5f6368">S3 Object Created</text>

  <rect x="330" y="260" width="220" height="60" rx="8" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="440" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">converter Lambda</text>
  <text x="440" y="303" text-anchor="middle" font-size="11" fill="#5f6368">reads JSON → PutRecordBatch</text>

  <rect x="620" y="260" width="220" height="60" rx="8" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="730" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">Kinesis Firehose</text>
  <text x="730" y="303" text-anchor="middle" font-size="11" fill="#5f6368">JSON → Parquet (Glue schema)</text>

  <rect x="900" y="260" width="150" height="60" rx="8" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="975" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">Parquet S3</text>
  <text x="975" y="303" text-anchor="middle" font-size="11" fill="#5f6368">data/year=…/month=…/day=…</text>

  <line x1="160" y1="175" x2="160" y2="258" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="290" x2="328" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="290" x2="618" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="290" x2="898" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- error path -->
  <rect x="60" y="345" width="200" height="50" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="160" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#d93025">errors/</text>
  <text x="160" y="384" text-anchor="middle" font-size="10" fill="#5f6368">processing-failed JSON</text>
  <line x1="730" y1="320" x2="160" y2="343" stroke="#d93025" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 3: CATALOG ============ -->
  <rect x="30" y="440" width="1040" height="120" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="50" y="462" font-size="13" font-weight="bold" fill="#137333">3 · Catalog &amp; Discovery</text>

  <rect x="60" y="480" width="220" height="60" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="170" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">Glue Crawler</text>
  <text x="170" y="523" text-anchor="middle" font-size="11" fill="#5f6368">daily · discovers partitions</text>

  <rect x="620" y="480" width="220" height="60" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="730" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">Glue Catalog</text>
  <text x="730" y="523" text-anchor="middle" font-size="11" fill="#5f6368">breakglass_db.cloudtrail_breakglass</text>

  <line x1="975" y1="320" x2="975" y2="478" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="510" x2="618" y2="510" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="540" x2="170" y2="560" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 4: ANALYTICS ============ -->
  <rect x="30" y="580" width="1040" height="180" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
  <text x="50" y="602" font-size="13" font-weight="bold" fill="#7627bb">4 · Analytics &amp; Visualization</text>

  <rect x="60" y="620" width="220" height="60" rx="8" fill="#ffffff" stroke="#9334e6" stroke-width="1.5"/>
  <text x="170" y="645" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">Athena Workgroup</text>
  <text x="170" y="663" text-anchor="middle" font-size="11" fill="#5f6368">breakglass-analytics</text>

  <rect x="330" y="620" width="220" height="60" rx="8" fill="#ffffff" stroke="#9334e6" stroke-width="1.5"/>
  <text x="440" y="645" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">Named Queries</text>
  <text x="440" y="663" text-anchor="middle" font-size="11" fill="#5f6368">top_apis · daily_usage · unique_users · service_heatmap</text>

  <rect x="620" y="620" width="220" height="60" rx="8" fill="#ffffff" stroke="#9334e6" stroke-width="1.5"/>
  <text x="730" y="645" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">QuickSight Data Source</text>
  <text x="730" y="663" text-anchor="middle" font-size="11" fill="#5f6368">breakglass-athena (ATHENA)</text>

  <rect x="900" y="620" width="150" height="60" rx="8" fill="#ffffff" stroke="#9334e6" stroke-width="1.5"/>
  <text x="975" y="645" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">QuickSight Dataset</text>
  <text x="975" y="663" text-anchor="middle" font-size="11" fill="#5f6368">BreakGlass Top APIs</text>

  <line x1="730" y1="540" x2="170" y2="618" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="650" x2="328" y2="650" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="650" x2="618" y2="650" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="650" x2="898" y2="650" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- athena results path -->
  <rect x="60" y="700" width="220" height="40" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="170" y="725" text-anchor="middle" font-size="11" font-weight="bold" fill="#d93025">athena-results/ (CSV)</text>
  <line x1="170" y1="680" x2="170" y2="698" stroke="#d93025" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 5: OUTPUT ============ -->
  <rect x="30" y="780" width="1040" height="90" rx="10" fill="#e8eaed" stroke="#5f6368" stroke-width="1.5"/>
  <text x="50" y="802" font-size="13" font-weight="bold" fill="#3c4043">5 · Output</text>

  <rect x="60" y="815" width="300" height="40" rx="8" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="210" y="840" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">QuickSight Analysis / Dashboard</text>

  <rect x="420" y="815" width="300" height="40" rx="8" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="570" y="840" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">Athena Query Console</text>

  <line x1="975" y1="680" x2="210" y2="813" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="680" x2="570" y2="813" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="50" y="905" font-size="12" font-weight="bold" fill="#3c4043">Legend</text>
  <line x1="50" y1="925" x2="120" y2="925" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="930" font-size="11" fill="#5f6368">data flow</text>
  <line x1="230" y1="925" x2="300" y2="925" stroke="#d93025" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="310" y="930" font-size="11" fill="#5f6368">error / artifact path</text>
  <rect x="470" y="915" width="16" height="16" rx="3" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="495" y="929" font-size="11" fill="#5f6368">AWS service</text>
</svg>
